<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı · Ders Notlarım</title>
  <script>
    // Filet de sécurité : si /kitap/<slug>[/<bolum>] n'a pas été réécrit par le serveur,
    // on bascule vers la version avec paramètres (?k=…&b=…), qui marche partout.
    (function () {
      var p = location.pathname.split('/').filter(Boolean);
      if (p[0] === 'kitap' && p[1]) {
        var k = encodeURIComponent(decodeURIComponent(p[1]));
        if (p[2]) location.replace('/oku?k=' + k + '&b=' + encodeURIComponent(decodeURIComponent(p[2])));
        else location.replace('/kitap?k=' + k);
      }
    })();
  </script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="giris" style="padding-top:120px">
    <h1>Sayfa bulunamadı</h1>
    <p>Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir.</p>
    <p><a href="/">Ana sayfaya dön</a></p>
  </main>
</body>
</html>
